name: Collect jobs

on:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-jobs

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the pipeline
        run: node scripts/jobs/pipeline.check.ts
      - name: Collect listings
        run: node scripts/jobs/collect.ts
      - name: Commit jobs.json if it changed
        run: |
          git add public/data/jobs.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh job listings"
          git push
